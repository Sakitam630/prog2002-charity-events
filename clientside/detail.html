<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event details | Common Ground Brisbane</title><link rel="stylesheet" href="assets/styles.css"><script src="assets/site.js" defer></script><script src="assets/detail.js" defer></script></head>
<body data-page="detail">
